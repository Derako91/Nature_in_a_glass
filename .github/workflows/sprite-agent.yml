name: Sprite-Agent
on:
  pull_request:
    paths: ['tools/sprite_agent/**', '.github/workflows/sprite-agent.yml']
  push:
    branches: [main]
    paths: ['tools/sprite_agent/**', '.github/workflows/sprite-agent.yml']
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/sprite_agent/requirements.txt
      - run: python -m unittest discover -s tools/sprite_agent/tests -v
