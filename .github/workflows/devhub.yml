# DevHub-Torprüfung für PRs (STANDARD-VERSIONSSTAND.md §7) – siehe Derako91/Devhub docs/pr-pruefung.md
name: DevHub
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
permissions:
  contents: read
jobs:
  statuskopf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: Derako91/Devhub/.github/actions/statuskopf@main
        with:
          basis: origin/${{ github.base_ref }}
          branch: ${{ github.head_ref }}
          planung: ${{ contains(github.event.pull_request.labels.*.name, 'devhub:planung') || startsWith(github.head_ref, 'plan/') }}
