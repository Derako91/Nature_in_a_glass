name: Release

# Neue Version veröffentlichen: Versionsnummer in Cargo.toml
# (workspace.package.version) erhöhen und auf main pushen. Existiert für diese
# Version noch kein Release, werden Windows-, macOS- und Linux-Pakete gebaut und
# als Release vX.Y.Z (mit Tag) veröffentlicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION existiert bereits – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Neues Release v$VERSION wird gebaut."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            exe: .exe
          - name: macos
            os: macos-latest
            exe: ""
          - name: linux
            os: ubuntu-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release --workspace
      - name: Bauen
        run: cargo build --release -p nature-in-a-glass -p nig-sim
      - name: Paket schnüren
        shell: bash
        run: |
          DIR=nature-in-a-glass-${{ matrix.name }}
          mkdir "$DIR"
          cp target/release/nature-in-a-glass${{ matrix.exe }} "$DIR/"
          cp target/release/nig-sim${{ matrix.exe }} "$DIR/"
          cp docs/STARTEN.md "$DIR/LIESMICH.md"
          cp docs/CHANGELOG.md "$DIR/AENDERUNGEN.md"
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a "$DIR.zip" "$DIR"
          else
            zip -r "$DIR.zip" "$DIR"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nature-in-a-glass-${{ matrix.name }}
          path: nature-in-a-glass-${{ matrix.name }}.zip

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nature in a Glass ${{ needs.check.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Fertige Programme zum Herunterladen – Anleitung in LIESMICH.md im Paket bzw. docs/STARTEN.md.
            Was neu ist: AENDERUNGEN.md im Paket bzw. docs/CHANGELOG.md.

            - **Windows:** nature-in-a-glass-windows.zip
            - **macOS:** nature-in-a-glass-macos.zip
            - **Linux:** nature-in-a-glass-linux.zip
